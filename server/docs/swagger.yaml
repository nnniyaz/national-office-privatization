        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      security:
      - Bearer: []
      summary: Create contact information
      tags:
      - contacts
    put:
      consumes:
      - application/json
      description: Updates the contact information
      parameters:
      - description: Contact update data
        in: body
        name: contact
        required: true
        schema:

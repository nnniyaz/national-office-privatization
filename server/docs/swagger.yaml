host: https://api.nop.kz
info:
  contact:
    name: API Support
    url: https://t.me/nassyrovich
  description: Detailed info about all endpoints
  title: NOP API
  version: 0.0.1
paths:
  /api/application:
    get:
      consumes:
      - application/json
      description: Retrieves a list of all enterprise applications
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/application.Applications'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      security:
      - Bearer: []
      summary: Get all applications
      tags:
      - applications
    post:
      consumes:
      - application/json
      description: Creates a new enterprise application
      parameters:
      - description: Application data
        in: body
        name: application
        required: true
        schema:
          $ref: '#/definitions/application.CreateApplicationIn'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Success'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: Create a new application
      tags:
      - applications
    put:
      consumes:
      - application/json
      description: Updates an existing application
      parameters:
      - description: Application update data
        in: body
        name: application
        required: true
        schema:
          $ref: '#/definitions/application.UpdateApplicationIn'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Success'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      security:
      - Bearer: []
      summary: Update an application
      tags:
      - applications
  /api/application/{application_id}:
    delete:
      consumes:
      - application/json
      description: Deletes an application by ID
      parameters:
      - description: Application ID
        in: path
        name: application_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Success'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      security:
      - Bearer: []
      summary: Delete an application
      tags:
      - applications
    get:
      consumes:
      - application/json
      description: Retrieves a single application by ID
      parameters:
      - description: Application ID
        in: path
        name: application_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_nnniyaz_nop_server_handler_http_application.Application'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      security:
      - Bearer: []
      summary: Get application by ID
      tags:
      - applications
  /api/application/export:
    get:
      consumes:
      - application/json
      description: Exports applications to an Excel file, optionally filtered by creation
        period
      parameters:
      - description: Period start (RFC3339)
        in: query
        name: from
        type: string
      - description: Period end (RFC3339)
        in: query
        name: to
        type: string
      produces:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      security:
      - Bearer: []
      summary: Export applications to Excel
      tags:
      - applications
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns a session cookie
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/auth.LoginIn'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Success'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      summary: User login
      tags:
      - auth
  /api/auth/logout:
    post:
      consumes:
      - application/json
      description: Logs out the current user and clears the session cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Success'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      security:
      - Bearer: []
      summary: User logout
      tags:
      - auth
  /api/auth/me:
    get:
      consumes:
      - application/json
      description: Returns the currently logged in user's information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Error'
      security:
      - Bearer: []
      summary: Get current authenticated user
      tags:
      - auth
  /api/contacts:
    get:
      consumes:
      - application/json
      description: Retrieves the contact information
      produces:

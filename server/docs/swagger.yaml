paths:
  /upload/category-image:
    post:
      consumes:
      - multipart/form-data
      description: This can only be done by the logged-in user.
      parameters:
      - description: file to upload
        in: formData
        name: data
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Success'
        default:
          description: ""
          schema:
            $ref: '#/definitions/response.Error'
      summary: Uploads a category image
      tags:
      - Upload

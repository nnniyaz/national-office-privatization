apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-nop-client-deployment
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: prod-nop-client-pod
  template:
    metadata:
      labels:
        app: prod-nop-client-pod
    spec:
      containers:
        - name: prod-nop-client-container
          image: <IMAGE>
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.nop.kz"
            - name: NEXT_PUBLIC_SPACE_HOST
              valueFrom:
                secretKeyRef:
                  name: prod-nop-secret
                  key: SPACE_HOST
          ports:
            - containerPort: 8080
      dnsPolicy: ClusterFirstWithHostNet

